<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Bit Bot 应用图标 v2 — “对话里的两个 bit”

    设计取舍：
    - 旧图标的紫色四角星是 Grok 的视觉资产，不是这个项目的；去掉。
    - 项目内核是 MoonBit，核心意象是 bit（方块）。气泡 = Bot / 对话，
      两个错开的方块 = 内核与端（或多端之间的一次会话）。
    - 无渐变、无阴影、无外描边：在 16px 下仍能读出"气泡 + 两块"。
    - 深墨 #17181C 与桌面 UI 的 --ink 同族；蓝 #1E86FC 延续旧图标里
      那颗蓝色小方块的记忆点，作为唯一强调色。
  -->
  <rect width="1024" height="1024" rx="224" fill="#17181C"/>
  <rect x="212" y="266" width="600" height="430" rx="126" fill="#FFFFFF"/>
  <path d="M366 670 C354 728 338 776 330 800 C326 814 342 820 354 810 C392 782 434 736 474 684 Z" fill="#FFFFFF"/>
  <rect x="366" y="386" width="156" height="156" rx="36" fill="#17181C"/>
  <rect x="544" y="552" width="88" height="88" rx="22" fill="#1E86FC"/>
</svg>
