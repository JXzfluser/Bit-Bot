<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bit Bot Desktop</title>
<style>
  :root {
    --bg0: #0c1210;
    --bg1: #14201a;
    --ink: #e7f0ea;
    --muted: #8aa396;
    --line: #2a3d34;
    --accent: #3dba7e;
    --warn: #d4a017;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 15px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #1a3a2c 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #1e2a22 0%, transparent 50%),
      linear-gradient(165deg, var(--bg0), var(--bg1));
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--line);
  }
  header .brand {
    font: 700 28px/1.1 "IBM Plex Serif", Georgia, serif;
    letter-spacing: -0.02em;
  }
  header .sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  #banner {
    margin: 12px 24px 0;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0f1814cc;
    font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace;
    white-space: pre-wrap;
    color: var(--muted);
    max-height: 140px;
    overflow: auto;
  }
  #banner.ok { border-color: #2f6b4c; color: #b7e0c8; }
  #banner.err { border-color: #8a3a3a; color: #f0b4b4; }
  #log {
    flex: 1;
    overflow: auto;
    padding: 16px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 720px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #101a15;
  }
  .msg.user { align-self: flex-end; border-color: #355646; }
  .msg .role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .msg .body { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  #composer {
    padding: 12px 24px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
  }
  #composer input {
    flex: 1;
    background: #0e1612;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font: inherit;
  }
  #composer input:focus { outline: none; border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: #062014;
    border: 0;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
  }
  #composer button:disabled { opacity: 0.5; cursor: wait; }
  #json-out {
    margin: 0 24px 16px;
    padding: 10px 12px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    font: 11px/1.35 ui-monospace, monospace;
    color: var(--warn);
    white-space: pre-wrap;
    max-height: 160px;
    overflow: auto;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Bit Bot</div>
    <div class="sub">Desktop host · product brain = MoonBit (<code>cmd/desktop_turn</code>)</div>
  </header>
  <pre id="banner">booting MoonBit…</pre>
  <div id="log"></div>
  <pre id="json-out">turn JSON will appear here</pre>
  <form id="composer">
    <input id="text" type="text" placeholder="发消息给 MoonBit…" autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>
  <script>
    const banner = document.getElementById("banner");
    const log = document.getElementById("log");
    const jsonOut = document.getElementById("json-out");
    const form = document.getElementById("composer");
    const input = document.getElementById("text");
    const sendBtn = document.getElementById("send");

    function addMsg(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.innerHTML = '<div class="role"></div><div class="body"></div>';
      el.querySelector(".role").textContent = role;
      el.querySelector(".body").textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function boot() {
      try {
        const r = await window.bitbot.boot();
        banner.className = r.ok ? "ok" : "err";
        banner.textContent = (r.banner || JSON.stringify(r, null, 2)) +
          "\n\n[host] target=" + (r.target || "?") + " · " + (r.note || "");
      } catch (e) {
        banner.className = "err";
        banner.textContent = String(e && e.message ? e.message : e);
      }
    }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendBtn.disabled = true;
      addMsg("user", text);
      try {
        const r = await window.bitbot.turn(text);
        jsonOut.textContent = JSON.stringify(r, null, 2);
        if (r && Array.isArray(r.messages)) {
          for (const m of r.messages) {
            if (m.role === "user") continue;
            addMsg(m.role || "assistant", m.text || "");
          }
        } else if (r && r.error) {
          addMsg("assistant", "error: " + r.error);
        }
      } catch (e) {
        const msg = String(e && e.message ? e.message : e);
        jsonOut.textContent = msg;
        addMsg("assistant", msg);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    boot();
  </script>
</body>
</html>
