name: Moon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  moon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon check
        run: |
          moon version --all
          moon check

      # Formatting is a gate, not a suggestion. `moon fmt` is the documented
      # last step (AGENTS.md), so an unformatted tree must fail here rather
      # than accumulate as a silent diff on someone's branch.
      - name: moon fmt --check
        run: moon fmt --check

      # `.mbti` is the published interface of every package. If it drifts from
      # the source, downstream users read a contract that no longer exists.
      - name: moon info + interface drift gate
        run: |
          moon version --all
          moon info
          if ! git diff --exit-code -- '*.mbti'; then
            echo "::error title=mbti-drift::.mbti 与源码不一致 —— 本地跑 moon info 并提交生成结果"
            echo "若 diff 全部是 Int↔Int32：这是 moonc 版本的接口打印差异（0.10.16 起打印 Int32），"
            echo "不是契约变更：moon info 后确认只有这两类行，再 moon test --target native，一起提交。"
            exit 1
          fi

      # The shipped kernel is the NATIVE build (cmd/desktop_turn/moon.pkg puts
      # the live agent loop in the native-only file, and the Host defaults to
      # `--target native`). The wasm target compiles a *different* dispatcher —
      # the legacy planner — so testing wasm alone never exercises the code that
      # ships. Both targets are required: wasm keeps the legacy-planner path
      # covered, native covers the real ProductFfiHost loop.
      # `moon.mod`'s preferred_target is now `native`, so a bare `moon test`
      # already runs the shipped path.
      - name: moon test (wasm — legacy planner path)
        run: moon test --target wasm

      - name: moon test (native — the target production ships)
        run: moon test --target native

      # The capability matrix is the project's contract: every row names an
      # evidence file and a test name. Nothing stopped a row's evidence from
      # being renamed or deleted, so the matrix could quietly become a false
      # ledger. This gate makes every row machine-checkable.
      - name: Capability matrix evidence
        run: node scripts/prove_capability_matrix.mjs

      # Capabilities that are implemented and evidenced but have NO production
      # consumer are not delivered — the matrix says PASS, the product cannot
      # reach them. They are tracked (not deleted) so the claim stays honest,
      # and this gate keeps the tracking list from drifting.
      - name: Contract layer inventory
        run: node scripts/prove_contract_layer.mjs

      # The matrix's PASS means "implemented and tested", not "a user can reach
      # it". This ledger classifies every CM into user / partial / test-only /
      # wired, and pins the numbers in docs/qa/product-readiness.md so the
      # distinction cannot quietly drift back into one big "234 PASS".
      - name: Product readiness ledger
        run: node scripts/prove_readiness_ledger.mjs

      # UI debt ratchet. It is LINT ONLY (the real proof is e2e_desktop_*), but
      # it is the only thing stopping `!important` / literal hex / inline
      # font-size from creeping back after each redesign. Baselines only go down.
      - name: UI token / debt ratchet
        run: node scripts/prove_ui_tokens.js

      # The tool-name alias table is a load-bearing contract: the registry
      # lookup, the policy approval list, the deny list and the Host's
      # router all match on exact strings. When the kernel's copy and the
      # Host's copy drifted, a camelCase spelling could skip a tool's
      # approval. This gate keeps the two tables identical.
      - name: Tool name alias contract
        run: node scripts/prove_tool_names.mjs

      # "What does a credential look like?" must be answered the same way by
      # the kernel and the Host. The kernel's rule table used to be narrower,
      # so `API_KEY=…` passed the backstop that keeps plaintext out of the
      # transcript for CLI and API callers. This gate compares the two rule
      # tables AND asks the real kernel binary for a verdict on a corpus.
      - name: Secret shape contract
        run: node scripts/prove_secret_shapes.mjs

      # A group turn that fails must SAY so. The user-visible symptom of a
      # stuck room turn was "message sent, nobody replied, no error at all" —
      # indistinguishable from the bot ignoring them. This gate pins the
      # failure surfaces: the Host-side deadline, the renderer's backstop, the
      # honest "these groups were dissolved" cascade report, and a send button
      # whose disabled state is actually visible.
      - name: Room failure surfaces
        run: node scripts/prove_room_failure_surfaces.mjs

      # Best-effort only: Live Host / Chrome / display may be absent on ubuntu-latest.
      - name: Optional host_h4_smoke batch1
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if [[ ! -x scripts/host_h4_smoke.sh ]]; then
            echo "skip: scripts/host_h4_smoke.sh missing"
            exit 0
          fi
          bash scripts/host_h4_smoke.sh batch1

      - name: Optional host_h5_smoke media
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "skip: ffmpeg missing"
            exit 0
          fi
          if [[ ! -x scripts/host_h5_smoke.sh ]]; then
            echo "skip: scripts/host_h5_smoke.sh missing"
            exit 0
          fi
          bash scripts/host_h5_smoke.sh media

      # H6 full matrix I sweep (fast: skip moon test already run above).
      - name: Optional host_matrix_i_sweep all
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if [[ ! -x scripts/host_matrix_i_sweep.sh ]]; then
            echo "skip: scripts/host_matrix_i_sweep.sh missing"
            exit 0
          fi
          # Prefer committed H6 TODO_INPUT (matrix may already be I-PASS).
          if [[ -f docs/qa/artifacts/h6-matrix-i/TODO_INPUT.json && ! -f /tmp/matrix_todo.json ]]; then
            cp docs/qa/artifacts/h6-matrix-i/TODO_INPUT.json /tmp/matrix_todo.json
          fi
          H6_FAST=1 bash scripts/host_matrix_i_sweep.sh all
