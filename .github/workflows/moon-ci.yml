name: Moon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  moon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon check
        run: |
          moon version --all
          moon check

      - name: moon test
        run: moon test

      # Best-effort only: Live Host / Chrome / display may be absent on ubuntu-latest.
      - name: Optional host_h4_smoke batch1
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if [[ ! -x scripts/host_h4_smoke.sh ]]; then
            echo "skip: scripts/host_h4_smoke.sh missing"
            exit 0
          fi
          bash scripts/host_h4_smoke.sh batch1

      - name: Optional host_h5_smoke media
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "skip: ffmpeg missing"
            exit 0
          fi
          if [[ ! -x scripts/host_h5_smoke.sh ]]; then
            echo "skip: scripts/host_h5_smoke.sh missing"
            exit 0
          fi
          bash scripts/host_h5_smoke.sh media

      # H6 full matrix I sweep (fast: skip moon test already run above).
      - name: Optional host_matrix_i_sweep all
        continue-on-error: true
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "skip: python3 missing"
            exit 0
          fi
          if [[ ! -x scripts/host_matrix_i_sweep.sh ]]; then
            echo "skip: scripts/host_matrix_i_sweep.sh missing"
            exit 0
          fi
          # Prefer regenerating todo list from matrix if /tmp/matrix_todo.json absent.
          if [[ ! -f /tmp/matrix_todo.json ]]; then
            python3 - <<'PY'
import json, re
from pathlib import Path
text = Path("docs/capability-matrix.md").read_text(encoding="utf-8")
# H6 CI: if matrix already I-PASS, still emit empty todo (sweep no-ops ok)
rows = re.findall(
    r"^\| (CM-\d+) \|.*?\| ([^|]+) \| ([^|]+) \|\s*$", text, re.M
)
todo = []
for cm, i_st, u_st in rows:
    if i_st.strip() == "todo" and u_st.strip().startswith("PASS"):
        todo.append({"cm": cm, "i": "todo", "u": "PASS", "evidence": "", "test": "", "file": ""})
Path("/tmp/matrix_todo.json").write_text(json.dumps({"todo": todo}, indent=2) + "\n")
print("wrote /tmp/matrix_todo.json count=", len(todo))
PY
          fi
          H6_FAST=1 bash scripts/host_matrix_i_sweep.sh all
