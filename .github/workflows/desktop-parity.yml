name: Desktop Parity Matrix

# 全量矩阵（scripts/smoke_grok_desktop_parity.sh）此前只在开发机上跑：
# 「最后一个跑的人」看到的 441/0 就是全部证据，别人合进去之前没人复核。
# 这条 workflow 把它搬进 CI，让同一份代码在干净机器上重复得到同一个数字。
#
# 为什么是整套而不是挑几条：
#   - 这套矩阵里 90% 的项是「真 Electron + 真内核 + 真文件」的端到端断言，
#     挑着跑等于把「哪几条算数」变成一个每次都要重新吵的问题；
#   - 它会自己打印 PASS=/FAIL=，并且 FAIL≠0 时退出码非 0，CI 不需要再解释。
#
# 诚实边界（不在门里声明成功，只在日志里说清楚）：
#   - Android APK 真编译需要 SDK/gradle/JDK。ubuntu-latest 自带 Android SDK，
#     但 gradle 与 JDK 版本由 runner 决定；缺任一件时 prove_android_build 会
#     打印 SKIP（SKIP ≠ PASS），矩阵会把它当 skip 记，不当绿。
#   - 这里**不**做 macOS / Windows 的真机安装验证：那是另一个平台的事，
#     desktop-macos.yml 只负责打包，不代表「装上了、跑通了」。
#   - workflow 是否真的在 GitHub 上跑绿，只有在 Actions 页面上看见才算数；
#     提交这条 workflow 本身不是「CI 已绿」的证据。

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/next-target-v1
      - main
  pull_request:
    branches:
      - main

# 矩阵要 15 分钟上下；新推一次就取消旧的那次，别让两条抢同一个 Xvfb/端口。
concurrency:
  group: desktop-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Host info
        run: |
          uname -a
          node -v
          npm -v
          java -version || echo "[ci] no java on PATH"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build kernel (native)
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version --all
          moon check
          moon build --target native
          # 矩阵 G-58（T1-07 常驻内核契约）只认 release 产物；只有 debug 时它会打
          # 「SKIP ≠ PASS」然后整块跳过 —— 也就是这条链在 CI 上从没被验证过
          # （详见 docs/design/desktop-target/report.md §8.46 ⑧ 的逐字 skip 行）。
          moon build --target native --release
          # 这一步本身就是断言：产物不在就当场红，而不是让矩阵把 G-58 记成
          # 「SKIP ≠ PASS」后仍然整体绿 —— 覆盖面断了但状态是绿的，是最难发现的一种红。
          ls _build/native/release/build/cmd/desktop_turn/desktop_turn* >/dev/null

      - name: Install app deps (locked)
        run: npm ci --prefix hosts/desktop

      - name: Install Xvfb
        run: |
          sudo apt-get update
          # G-64（旧 smoke_desktop_turn）会真跑媒体/截图/OCR/OS 输入：
          # ffmpeg 管视频与截图，espeak-ng 管 TTS 真样本，tesseract 管 OCR，
          # xdotool/wmctrl 供 computer_use 的原生窗口路径，openbox 是窗口管理器
          # （没有 WM 时窗口清单是空的，原生 act 只能 SKIP）。缺哪件，脚本会逐行打
          # SKIP（不算 PASS）；这里装上是为了让 CI 覆盖面真实而不是靠跳过。
          # Pillow / python-pptx 是 Host 媒体真产物的运行期依赖（generate_image、
          # structured_chart、slides_pptx）：runner 镜像默认没有，缺了 G-64 会在
          # 媒体段红。（#10/#11 的 29 秒红真因是 host_h5_media.py 硬编码
          # /workspace，见 report §8.49.8；这里补的是第二个坑，别让下一个红是它。）
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox ffmpeg espeak-ng tesseract-ocr xdotool wmctrl
          python3 -m pip install --quiet --user --break-system-packages pillow python-pptx \
            || python3 -m pip install --quiet --user pillow python-pptx
          # 这一步本身是断言：依赖不在就当场红，而不是让 G-64 红在一个看不懂的
          # AssertionError 上，也不是让矩阵把它当「环境没有 → SKIP」混过去。
          python3 -c "import PIL, pptx; print('media py deps ok', PIL.__version__, pptx.__version__)"

      # 矩阵自己会在没有 DISPLAY 时用 xvfb-run 包一层；这里再包一层是给
      # 「外层没有 DISPLAY」的 CI 一个确定的环境，不依赖门禁的自愈逻辑。
      # BITBOT_START_WM=1：G-64 会在 Xvfb 里起 openbox，让 computer_use 的
      # 原生 OS act 真跑（真窗口清单 + xdotool 点击、residual 真关），而不是
      # 因为「没有窗口管理器」永远 SKIP。没有 openbox 时脚本仍会退回 SKIP，
      # 不会假绿。
      - name: Run full parity matrix
        shell: bash
        env:
          BITBOT_START_WM: "1"
        run: |
          set -o pipefail
          export PATH="$HOME/.moon/bin:$PATH"
          xvfb-run -a bash scripts/smoke_grok_desktop_parity.sh 2>&1 | tee /tmp/parity-matrix.log

      # 为什么要把 ✗ 行写成注解：Actions 的运行日志对未登录读者是「Sign in to
      # view logs」，而注解（::error）在 run 页面对所有人可见。矩阵在干净机器上
      # 红了、本地却复现不出来时，这几行就是唯一能拿到的事实 —— 没有它只能盲重跑。
      - name: Show red lines (if any)
        if: failure()
        shell: bash
        run: |
          echo "== ✗ lines =="
          grep -n "✗" /tmp/parity-matrix.log || echo "(none)"
          echo "== tail =="
          tail -80 /tmp/parity-matrix.log || true
          echo "== sub-gate logs =="
          ls -la /tmp/*.log 2>/dev/null | head -50 || true
          {
            echo "### matrix ✗ lines"
            echo '```'
            grep -n "✗" /tmp/parity-matrix.log | head -10 || echo "(none)"
            echo '```'
            echo "### tail 25"
            echo '```'
            tail -25 /tmp/parity-matrix.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          grep "✗" /tmp/parity-matrix.log | head -10 | while IFS= read -r line; do
            printf '::error title=parity-red::%s\n' "$line"
          done || true

      - name: Upload matrix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-matrix-log
          path: |
            /tmp/parity-matrix.log
            /tmp/g4*.log
            /tmp/g6*.log
            /tmp/gp1*.log
          if-no-files-found: ignore
          retention-days: 14
